name: Feature Request
description: Suggest a new capability, analytics view, model pricing update, or UX improvement. / 提出新功能、扩展能力或体验优化建议。
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Use Case
      description: |
        What workflow or problem are you trying to solve?
        你希望解决什么使用场景或痛点？
      placeholder: e.g. When switching across workspaces, I want to...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: |
        Describe how you envision this working (examples or mockups welcome).
        描述你期望的交互或实现效果（欢迎附示例）。
    validations:
      required: false
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: |
        Optional OS, CLI/IDE setup, or constraints.
        可选：系统环境、CLI/IDE 使用方式或其他补充说明。
    validations:
      required: false
